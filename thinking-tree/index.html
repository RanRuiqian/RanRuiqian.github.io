<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>思路树 · Thinking Tree</title>
<style>
/* VOICE: calm studio tool. IDEA: a drafting board with cards pinned on it.
   PICTURE: the board fills the screen; tools float above it.
   COLOUR: warm paper, ink cards, one muted hue per top-level branch.
   TYPE: system sans for UI, serif for reading. LAYOUT: floating bar top, floating sheet right. */
:root{
  --bg:#f3f2ee;--dot:#d9d7cf;--card:#fff;--ink:#1d1d1b;--mute:#6d6b64;--line:#e3e1da;--soft:#f7f6f2;
  --shadow:0 1px 2px rgba(20,20,10,.06),0 4px 14px rgba(20,20,10,.06);--shadow2:0 2px 6px rgba(20,20,10,.08),0 14px 40px rgba(20,20,10,.12);
  --acc:#2f5bd3;--hl:#ffe680;--ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --serif:"Iowan Old Style","Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151514;--dot:#2c2c29;--card:#21211f;--ink:#ecebe6;--mute:#a19f97;--line:#34332f;--soft:#1b1b19;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);--shadow2:0 2px 6px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.5);--acc:#7d9bff;--hl:#6b5a14;color-scheme:dark}}
:root[data-theme=dark]{--bg:#151514;--dot:#2c2c29;--card:#21211f;--ink:#ecebe6;--mute:#a19f97;--line:#34332f;--soft:#1b1b19;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);--shadow2:0 2px 6px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.5);--acc:#7d9bff;--hl:#6b5a14;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px)}
#vp.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.anim .node{transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1)}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#edges .e{fill:none;stroke-width:1.8;opacity:.85}
#edges .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
#edges .hd{r:5.5;fill:var(--card);stroke-width:2;opacity:0;cursor:crosshair;pointer-events:all;transition:opacity .15s}
#edges g:hover .hd,#edges g.on .hd{opacity:1}
#edges g:hover .e,#edges g.on .e{stroke-width:2.6;opacity:1}
#edges .tmp{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:6 5}
.node{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);user-select:none;cursor:default;display:flex;flex-direction:column}
.node .row{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 14px;flex:none}
.node .sw{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--mute))}
.node .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.node .dd{width:5px;height:5px;border-radius:50%;background:var(--mute);opacity:.7;flex:none}
.node .tg{flex:none;min-width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;font-size:12px;color:var(--mute);cursor:pointer;padding:0 5px}
.node .tg:hover{color:var(--ink);border-color:var(--mute)}
.node.root{background:var(--ink);color:var(--card);border-color:var(--ink)}
.node.root .tx{font-weight:650;font-size:15.5px}.node.root .tg{background:transparent;color:inherit;border-color:rgba(127,127,127,.5)}
.node.sel{box-shadow:0 0 0 2px var(--acc),var(--shadow2)}
.node.drop{box-shadow:0 0 0 3px var(--acc),var(--shadow2)}
.node.match .tx{background:var(--hl);border-radius:3px}
.node.dragging{box-shadow:var(--shadow2);opacity:.96;z-index:3}
.port{position:absolute;top:22px;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--card);border:2px solid var(--c,var(--mute));opacity:0;transition:opacity .15s,transform .15s;cursor:crosshair;z-index:2}
.port.in{left:-7px}.port.out{right:-7px}
.node:hover .port,.node.sel .port,#world.linking .port{opacity:1}
#world.linking .node.drop .port.in,#world.linking.toparent .node.drop .port.out{transform:scale(1.5);background:var(--acc);border-color:var(--acc)}
#world.linking.toparent .node.drop .port.in{transform:none;background:var(--card);border-color:var(--c,var(--mute))}
.node .pv{margin:0 10px 10px;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line);cursor:zoom-in;flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.node .pv img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.node .pv.pdf img{object-fit:contain;object-position:top;background:#fff}
.node .pv .doc{padding:10px 12px;font:12px/1.55 var(--serif);color:var(--ink);height:100%;width:100%;overflow:hidden;align-self:stretch;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.node .pv table{border-collapse:collapse;font-size:11px;width:100%;align-self:flex-start;color:var(--ink)}
.node .pv td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.node .pv tr:first-child td{font-weight:600;background:var(--card)}
.node .pv .ext{position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--ink);color:var(--card)}
.node .pv .gen{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:12px}
.chrome{position:fixed;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2)}
#top{z-index:12;left:16px;top:14px;right:16px;display:flex;align-items:center;gap:6px;padding:6px;flex-wrap:wrap;max-width:max-content}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 0 6px;font-weight:650;font-size:15px;white-space:nowrap}
.brand b{width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:13px}
#mapSel{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:6px 8px;max-width:210px;height:34px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.ib{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:0;border-radius:9px;background:transparent;cursor:pointer;white-space:nowrap;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.pri{background:var(--ink);color:var(--card)}.ib.pri:hover{opacity:.9;background:var(--ink)}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:2px;border:1px solid var(--line)}
.seg button{border:0;background:none;height:28px;padding:0 9px;border-radius:7px;cursor:pointer;color:var(--mute)}
.seg button:hover{color:var(--ink);background:var(--card)}
#mode{font-size:12px;color:var(--mute);padding:0 6px;white-space:nowrap}
#mode b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3f8f7a;margin-right:5px;vertical-align:1px}
#mode.free b{background:#d98a1e}
#q{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:0 10px;width:150px}
.menu{position:relative}
.menu .list{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;padding:6px;display:none;flex-direction:column}
.menu.open .list{display:flex}
.menu .list button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu .list button:hover{background:var(--soft)}
.menu .list hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#zoombar{left:16px;bottom:16px;display:flex;align-items:center;gap:2px;padding:4px}
#zl{min-width:48px;text-align:center;color:var(--mute);font-size:12px}
#status{right:16px;bottom:16px;padding:6px 12px;font-size:12px;color:var(--mute);box-shadow:var(--shadow)}
#panel{right:16px;top:74px;bottom:58px;width:380px;display:flex;flex-direction:column;overflow:hidden}
#panel.hide{display:none}
#panel .hd{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
#panel .hd .crumb{flex:1;color:var(--mute);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#panel .bd{flex:1;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
#tIn{border:0;background:transparent;font-size:21px;font-weight:650;padding:2px 0;border-bottom:1px solid transparent;width:100%}
#tIn:focus{outline:none;border-bottom-color:var(--line)}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:12px}
.meta span{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:2px}
.tabs button{border:0;background:none;padding:4px 12px;border-radius:7px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
#dView{font:15px/1.8 var(--serif)}
#dView p{margin:0 0 .7em}#dView ul,#dView ol{margin:0 0 .7em;padding-left:1.3em}#dView li{margin:.2em 0}#dView a{color:var(--acc)}
#dView .empty{color:var(--mute);font-family:var(--ui);font-size:13px}
#dIn{min-height:300px;flex:1;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:12px;font:14px/1.75 var(--serif);resize:vertical}
#mediaBox{display:flex;flex-direction:column;gap:8px}
#mediaBox .pvbig{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);cursor:zoom-in;max-height:240px;display:flex;align-items:center;justify-content:center}
#mediaBox .pvbig img{max-width:100%;max-height:240px;display:block}
#mediaBox .acts{display:flex;gap:6px;flex-wrap:wrap}
.sb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.sb:hover,.sb.on{border-color:var(--mute)}
.tip{color:var(--mute);font-size:12px;line-height:1.75;border-top:1px solid var(--line);padding-top:12px}
.tip kbd{font:11px var(--ui);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,10,8,.42);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{position:relative;width:min(440px,100%);padding:18px;border-radius:14px}
.modal p{margin:0 0 12px;font-size:15px}
.modal input{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:9px 10px;font-size:16px;margin-bottom:14px}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
#viewer .box{width:min(1100px,100%);height:min(88vh,900px);padding:0;display:flex;flex-direction:column;overflow:hidden}
#viewer .vh{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
#viewer .vh b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#viewer .vb{flex:1;overflow:auto;background:var(--soft)}
#viewer .vb img{max-width:100%;display:block;margin:auto}
#viewer .vb iframe{width:100%;height:100%;border:0;background:#fff}
#viewer .vb .docx{max-width:800px;margin:0 auto;background:var(--card);padding:40px 48px;font:15px/1.8 var(--serif);min-height:100%}
#viewer .vb .docx img{max-width:100%}
#viewer .vb .sheet{padding:12px}
#viewer .vb .sheet table{border-collapse:collapse;background:var(--card);font-size:13px}
#viewer .vb .sheet td,#viewer .vb .sheet th{border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
#viewer .stabs{display:flex;gap:4px;padding:8px 12px 0;flex-wrap:wrap}#viewer .stabs:empty{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(10px);z-index:60;background:var(--ink);color:var(--card);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow2)}
.toast.on{opacity:1;transform:translateX(-50%)}
#drophint{position:fixed;inset:12px;border:2px dashed var(--acc);border-radius:18px;z-index:30;display:none;align-items:center;justify-content:center;font-size:18px;color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,transparent);pointer-events:none}
#drophint.on{display:flex}
#roBar{left:50%;top:74px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 6px 6px 14px;font-size:13px;max-width:calc(100% - 32px)}
body.ro #roBar{display:flex}body.ro .edit{display:none}body.ro .list button:not([data-ro]),body.ro .list hr{display:none}
#shareM .box{width:min(520px,100%)}#shareM h3{margin:0 0 6px;font-size:17px}#shareM .sm{color:var(--mute);font-size:13px;line-height:1.7;margin:0 0 12px}
#shareM ol{margin:0 0 12px;padding-left:1.2em;font-size:13px;line-height:1.8}#shareM a{color:var(--acc)}
#shareM input[type=text],#shareM input[type=password]{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:9px 10px;margin-bottom:10px}
#shareM label{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
#shareM .link{display:flex;gap:6px;margin-bottom:10px}#shareM .link input{margin:0;font-size:12px}
#shareM .row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){#world.anim .node,.toast,.port{transition:none}}
@media (max-width:820px){
  .lbl{display:none}#q{width:100px}#mapSel{max-width:120px}.opt{display:none}#top{left:8px;right:8px;top:8px}
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:52%}
  #zoombar{left:8px;bottom:8px}#status{display:none}
  #panel:not(.hide)~#zoombar{display:none}
}
</style>
</head>
<body>
<div id="vp" tabindex="0" aria-label="思路画布"><div id="world"><svg id="edges"></svg></div></div>

<div id="top" class="chrome" role="toolbar" aria-label="工具栏">
  <div class="brand"><b>思</b><span class="lbl">思路树</span></div>
  <select id="mapSel" aria-label="切换导图"></select>
  <span class="sep"></span>
  <button class="ib pri edit" id="bChild" title="添加子节点（Tab）"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">子节点</span></button>
  <button class="ib edit" id="bSib" title="添加同级节点（Enter）"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M4 12h10M4 17h6M18 14v6M15 17h6"/></svg><span class="lbl">同级</span></button>
  <button class="ib edit" id="bFile" title="插入图片、PDF、Word、Excel（也可以直接把文件拖到画布上）"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 15h6"/></svg><span class="lbl">文件</span></button>
  <button class="ib edit" id="bDel" title="删除（Delete）"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
  <span class="sep"></span>
  <button class="ib" id="bUndo" title="撤销（Ctrl+Z）"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="ib" id="bRedo" title="重做（Ctrl+Shift+Z）"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <span class="sep"></span>
  <button class="ib" id="bLayout" title="一键排版：按树形重新整理"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="9" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 12h3v-6h3M12 12v6h3"/></svg><span class="lbl">一键排版</span></button>
  <span id="mode" class="opt"><b></b><span>树形排版</span></span>
  <div class="seg opt" title="展开层级"><button data-l="1">一层</button><button data-l="2">两层</button><button data-l="99">全部</button></div>
  <span class="sep opt"></span>
  <input id="q" type="search" placeholder="搜索…" aria-label="搜索节点">
  <div class="menu" id="menu">
    <button class="ib" id="bMenu" aria-haspopup="true" title="导图菜单"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    <div class="list chrome">
      <button data-a="share">分享链接…</button><button data-a="keep" data-ro>保存到我的导图</button><hr><button data-a="new">新建空白导图</button><button data-a="rename">重命名当前导图</button><button data-a="dup">复制当前导图</button>
      <hr><button data-a="export" data-ro>导出 JSON（含文件，用于备份）</button><button data-a="import">导入 JSON</button><button data-a="md" data-ro>复制为 Markdown 大纲</button>
      <hr><button data-a="seed">载入使用说明</button><button data-a="delmap">删除当前导图</button>
    </div>
  </div>
</div>

<aside id="panel" class="chrome hide" aria-label="节点详情">
  <div class="hd"><span class="crumb" id="crumb"></span><span class="tabs"><button id="tView" class="on">阅读</button><button id="tEdit">编辑</button></span><button class="ib" id="close" title="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="bd">
    <input id="tIn" aria-label="节点标题" placeholder="节点标题">
    <div class="meta" id="meta"></div>
    <div id="mediaBox" hidden></div>
    <div id="dView"></div>
    <textarea id="dIn" hidden aria-label="详细内容" placeholder="写下详细内容。&#10;- 开头为列表，1. 开头为编号&#10;**加粗**，[文字](https://链接)"></textarea>
    <div class="tip">拖动节点可以自由摆放（按住 Alt 只拖这一个，不带下级）。拖动连线的端点，或节点两侧的圆形接头，放到另一个节点上即可改连；从右侧接头拉到空白处会新建子节点。自由摆放时连线会自动绕开节点，点“一键排版”恢复树形。<br>
    <kbd>Tab</kbd> 子节点 · <kbd>Enter</kbd> 同级 · <kbd>Delete</kbd> 删除 · <kbd>空格</kbd> 展开/收起 · <kbd>F2</kbd> 改标题 · <kbd>Ctrl+Z</kbd> 撤销 · 滚轮缩放，按住空白处拖动平移。<br>
    内容保存在本浏览器中，换设备前请在菜单里导出 JSON 备份。</div>
  </div>
</aside>

<div id="zoombar" class="chrome">
  <button class="ib" id="bOut" title="缩小"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <span id="zl">100%</span>
  <button class="ib" id="bIn" title="放大"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="bFit" title="适应窗口"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="status" class="chrome">准备就绪</div>
<input type="file" id="fileIn" hidden multiple accept="image/*,.pdf,.docx,.doc,.xlsx,.xls,.csv">
<input type="file" id="jsonIn" hidden accept=".json,application/json">
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box chrome"><p id="mMsg"></p><input id="mIn"><div class="row"><button class="sb" id="mNo">取消</button><button class="ib pri" id="mOk">确定</button></div></div></div>
<div class="modal" id="viewer" role="dialog" aria-modal="true"><div class="box chrome"><div class="vh"><b id="vTitle"></b><button class="sb" id="vDl">下载</button><button class="ib" id="vClose" title="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="stabs" id="vTabs"></div><div class="vb" id="vBody"></div></div></div>
<div id="roBar" class="chrome"><span>这是别人分享给你的导图，只能查看，改动不会保存。</span><button class="ib pri" id="bKeep">保存一份到我的导图</button></div>
<div class="modal" id="shareM" role="dialog" aria-modal="true"><div class="box chrome" id="shareBox"></div></div>
<div id="drophint">松开即可把文件放到这里</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const KEY='thinking-tree.v2', OLDKEY='thinking-tree.v1';
const TW=224, TH=44, MW=264, HG=72, VG=14, G=12;
const PAL=['#4f6fb5','#3f8f7a','#b07a2a','#8c5aa5','#b4553f','#6b8a3a','#3d7ea6','#a24e6e','#7a6a52','#4e5d8c','#8a6f2f','#3e8c8f'];
const LIBS={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'};
const $=s=>document.querySelector(s);
const vp=$('#vp'),world=$('#world'),svg=$('#edges');
let st={maps:[],cur:null},sel=null,view={x:80,y:90,s:1},query='',editMode=false;
let RO=false,undo=[],redo=[],dirty=false,saveT=null,routeCache={key:'',paths:{}},dragging=false;
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=()=>st.maps.find(m=>m.id===st.cur);
const N=id=>id?M().nodes[id]:null;
const kids=id=>Object.values(M().nodes).filter(n=>(n.p||null)===(id||null)).sort((a,b)=>a.k-b.k);
const roots=()=>kids(null);
function anc(id){const a=[];let n=N(id),g=0;while(n&&n.p&&g++<500){n=N(n.p);if(!n)break;a.push(n)}return a}
const isDesc=(id,of)=>anc(id).some(a=>a.id===of);
const depth=id=>anc(id).length;
const visible=id=>anc(id).every(a=>a.o);
function subtree(id){const out=[N(id)];for(const c of kids(id))out.push(...subtree(c.id));return out}
function branchColor(id){const n=N(id);if(!n||!n.p)return null;const a=anc(id);const top=a.length>=2?a[a.length-2]:n;const sib=kids(top.p);const i=Math.max(0,sib.findIndex(x=>x.id===top.id));return PAL[i%PAL.length]}
function size(n){if(!n.m)return {w:TW,h:TH};const m=n.m;let ph=56;
  if(m.kind==='image'&&m.thumb)ph=Math.round(Math.min(220,Math.max(90,(MW-20)/(m.ar||1.5))));else if(m.kind==='pdf'&&m.thumb)ph=190;else if(m.kind==='docx'&&m.prev)ph=130;else if(m.kind==='sheet'&&m.rows)ph=136;
  return {w:MW,h:TH+ph+10}}

function fromTree(r){const nodes={};let k=0;(function go(t,p,d){const id=uid();nodes[id]={id,t:String(t.t??t.title??'未命名'),d:String(t.d??t.detail??''),p,o:t.o!==undefined?!!t.o:d<1,k:k++,x:0,y:0,m:null};(t.c||t.children||[]).forEach(c=>go(c,id,d+1))})(r,null,0);return nodes}
function newMap(title,nodes,mode='auto'){const m={id:uid(),title,mode,nodes:nodes||fromTree({t:title})};st.maps.push(m);st.cur=m.id;sel=roots()[0]?.id;undo=[];redo=[];save();render();fit()}
function snap(){undo.push(JSON.stringify({n:M().nodes,mode:M().mode}));if(undo.length>150)undo.shift();redo=[]}
function restore(s){const o=JSON.parse(s);M().nodes=o.n;M().mode=o.mode}
function doUndo(){if(!undo.length)return;redo.push(JSON.stringify({n:M().nodes,mode:M().mode}));restore(undo.pop());if(!N(sel))sel=roots()[0]?.id;save();anim();render()}
function doRedo(){if(!redo.length)return;undo.push(JSON.stringify({n:M().nodes,mode:M().mode}));restore(redo.pop());if(!N(sel))sel=roots()[0]?.id;save();anim();render()}
function save(){if(RO)return;clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(st));$('#status').textContent='已自动保存 '+new Date().toTimeString().slice(0,5)}catch(e){$('#status').textContent='浏览器存储已满，请导出备份'}},300)}

/* files */
let dbp=null;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('thinking-tree-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function fput(k,blob){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(blob,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(k){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fdel(k){try{const d=await db();d.transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}}
const loaded={};
function lib(name){return loaded[name]||(loaded[name]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[name];s.onload=res;s.onerror=()=>{delete loaded[name];rej(new Error('lib'))};document.head.appendChild(s)}))}
function kindOf(f){const n=f.name.toLowerCase();if((f.type||'').startsWith('image/'))return 'image';if(n.endsWith('.pdf'))return 'pdf';if(n.endsWith('.docx'))return 'docx';if(/\.(xlsx|xls|csv)$/.test(n))return 'sheet';return 'file'}
const extOf=name=>(name.split('.').pop()||'').toUpperCase().slice(0,4);
async function thumbImage(blob){const u=URL.createObjectURL(blob);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});const sc=Math.min(1,520/im.width);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return {thumb:c.toDataURL('image/jpeg',.82),ar:im.width/im.height}}finally{URL.revokeObjectURL(u)}}
async function buildMedia(file){const kind=kindOf(file),key=uid(),m={kind,name:file.name,type:file.type,size:file.size,key};await fput(key,file);
  try{
    if(kind==='image')Object.assign(m,await thumbImage(file));
    else if(kind==='pdf'){await lib('pdf');pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfw;const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await pdf.getPage(1);const v0=pg.getViewport({scale:1});const vv=pg.getViewport({scale:520/v0.width});const c=document.createElement('canvas');c.width=vv.width;c.height=vv.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vv}).promise;m.thumb=c.toDataURL('image/jpeg',.8);m.pages=pdf.numPages}
    else if(kind==='docx'){await lib('mammoth');const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});m.prev=r.value.replace(/\n{2,}/g,'\n').trim().slice(0,420)}
    else if(kind==='sheet'){await lib('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];m.rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).slice(0,7).map(r=>Array.from({length:Math.min(5,Math.max(1,r.length))},(_,i)=>String(r[i]??'').slice(0,24)));m.sheets=wb.SheetNames.length}
  }catch(e){toast('文件已保存，但暂时无法生成预览')}
  return m}
function pvHTML(n){const m=n.m;if(!m)return '';const ext=`<span class="ext">${esc(extOf(m.name))}</span>`;
  if((m.kind==='image'||m.kind==='pdf')&&m.thumb)return `<div class="pv ${m.kind}" data-open="${n.id}"><img src="${m.thumb}" alt="" draggable="false">${m.kind==='pdf'?ext:''}</div>`;
  if(m.kind==='docx'&&m.prev)return `<div class="pv" data-open="${n.id}"><div class="doc">${esc(m.prev).replace(/\n/g,'<br>')}</div>${ext}</div>`;
  if(m.kind==='sheet'&&m.rows)return `<div class="pv" data-open="${n.id}"><table>${m.rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')}</table>${ext}</div>`;
  return `<div class="pv" data-open="${n.id}"><div class="gen"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>${esc(extOf(m.name))} 文件 · ${(m.size/1048576).toFixed(2)} MB</div></div>`}
async function openViewer(id){const n=N(id);if(!n||!n.m)return;const m=n.m,V=$('#viewer'),B=$('#vBody'),T=$('#vTabs');
  $('#vTitle').textContent=m.name;T.innerHTML='';B.innerHTML='<p style="padding:20px;color:var(--mute)">正在打开…</p>';V.classList.add('on');
  const blob=await fget(m.key).catch(()=>null);
  if(!blob){B.innerHTML='<p style="padding:20px">在这个浏览器里找不到原文件。请在原来的设备上导出 JSON，再在这里导入。</p>';$('#vDl').onclick=null;return}
  const url=URL.createObjectURL(blob);V._url=url;$('#vDl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=m.name;document.body.appendChild(a);a.click();a.remove()};
  try{
    if(m.kind==='image')B.innerHTML=`<img src="${url}" alt="">`;
    else if(m.kind==='pdf')B.innerHTML=`<iframe src="${url}" title="${esc(m.name)}"></iframe>`;
    else if(m.kind==='docx'){await lib('mammoth');const r=await mammoth.convertToHtml({arrayBuffer:await blob.arrayBuffer()});B.innerHTML=`<div class="docx">${r.value}</div>`}
    else if(m.kind==='sheet'){await lib('xlsx');const wb=XLSX.read(await blob.arrayBuffer(),{type:'array'});const show=i=>{B.innerHTML=`<div class="sheet">${XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[i]],{header:'',footer:''})}</div>`;[...T.children].forEach((b,j)=>b.classList.toggle('on',i===j))};
      T.innerHTML=wb.SheetNames.length>1?wb.SheetNames.map((s,i)=>`<button class="sb" data-i="${i}">${esc(s)}</button>`).join(''):'';T.onclick=e=>{const b=e.target.closest('[data-i]');if(b)show(+b.dataset.i)};show(0)}
    else B.innerHTML='<p style="padding:20px">这种格式无法在浏览器里预览，请点右上角“下载”。</p>';
  }catch(e){B.innerHTML='<p style="padding:20px">预览失败，请点右上角“下载”查看。</p>'}}
function closeViewer(){const V=$('#viewer');V.classList.remove('on');$('#vBody').innerHTML='';if(V._url){URL.revokeObjectURL(V._url);V._url=null}}

/* layout */
function autoLayout(){const colW=[];
  (function scan(list,d){for(const n of list){colW[d]=Math.max(colW[d]||0,size(n).w);if(n.o)scan(kids(n.id),d+1)}})(roots(),0);
  const colX=[0];for(let d=1;d<colW.length;d++)colX[d]=colX[d-1]+colW[d-1]+HG;
  let y=0;
  (function place(list,d){for(const n of list){const h=size(n).h,ks=n.o?kids(n.id):[];n.x=colX[d];
      if(ks.length){place(ks,d+1);const f=ks[0],l=ks[ks.length-1];const c=(f.y+size(f).h/2+l.y+size(l).h/2)/2;n.y=Math.round(c-h/2);if(n.y+h+VG>y)y=n.y+h+VG}
      else{n.y=y;y+=h+VG}
      if(d===0)y+=40}})(roots(),0)}
function materialize(){if(M().mode==='auto'){autoLayout();for(const n of Object.values(M().nodes)){if(visible(n.id))delete n.pl;else n.pl=false}M().mode='free'}}
function placeNew(){const un=n=>n.pl===false;
  const vis=Object.values(M().nodes).filter(n=>visible(n.id)&&un(n));if(!vis.length)return;
  const hOf=n=>{const ks=n.o?kids(n.id).filter(un):[];const own=size(n).h;if(!ks.length)return own;return Math.max(own,ks.reduce((a,k)=>a+hOf(k)+VG,-VG))};
  const lay=(p)=>{const ks=kids(p.id).filter(un);if(!ks.length)return;const tot=ks.reduce((a,k)=>a+hOf(k)+VG,-VG);let y=p.y+22-tot/2;const x=p.x+size(p).w+HG;
    for(const k of ks){const h=hOf(k);k.x=Math.round(x);k.y=Math.round(y+h/2-size(k).h/2);delete k.pl;if(k.o)lay(k);y+=h+VG}};
  for(const n of vis){if(!un(n))continue;const p=N(n.p);if(p&&!un(p)){const before=new Set(Object.values(M().nodes).filter(x=>!un(x)&&visible(x.id)).map(x=>x.id));lay(p);
      const S=Object.values(M().nodes).filter(x=>visible(x.id)&&!un(x)&&!before.has(x.id));avoid(S,before)}else if(!p){delete n.pl}}}
function avoid(S,othersIds){if(!S.length)return;const others=[...othersIds].map(N).filter(Boolean);const m=VG;
  const hit=dy=>S.some(a=>{const sa=size(a);return others.some(b=>{const sb=size(b);return a.x<b.x+sb.w+m&&a.x+sa.w+m>b.x&&a.y+dy<b.y+sb.h+m&&a.y+dy+sa.h+m>b.y})});
  if(!hit(0))return;const step=TH+VG;let best=null;for(let i=1;i<400;i++){for(const dy of [i*step/2,-i*step/2])if(!hit(dy)){best=dy;break}if(best!==null)break}
  if(best!==null)for(const a of S)a.y=Math.round(a.y+best)}

/* routing */
function port(n,side){const s=size(n);return side==='out'?{x:n.x+s.w,y:n.y+22}:{x:n.x,y:n.y+22}}
function bez(a,b){const dx=Math.max(40,Math.abs(b.x-a.x)/2);return `M${a.x} ${a.y}C${a.x+dx} ${a.y} ${b.x-dx} ${b.y} ${b.x} ${b.y}`}
function routeAll(vis,edges){const key=vis.map(n=>n.id+':'+Math.round(n.x)+','+Math.round(n.y)+','+size(n).h).join('|')+'#'+edges.map(e=>e.join('>')).join(',');
  if(routeCache.key===key)return routeCache.paths;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const n of vis){const s=size(n);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+s.w);y1=Math.max(y1,n.y+s.h)}
  x0-=160;y0-=160;x1+=160;y1+=160;const cols=Math.ceil((x1-x0)/G),rows=Math.ceil((y1-y0)/G),NC=cols*rows;const paths={};
  if(!isFinite(NC)||NC>700000){for(const [p,c] of edges)paths[c]=bez(port(N(p),'out'),port(N(c),'in'));return paths}
  const blk=new Uint8Array(NC),pad=8;
  for(const n of vis){const s=size(n);const a=Math.floor((n.x-pad-x0)/G),b=Math.floor((n.y-pad-y0)/G),c=Math.ceil((n.x+s.w+pad-x0)/G),d=Math.ceil((n.y+s.h+pad-y0)/G);for(let j=Math.max(0,b);j<Math.min(rows,d);j++)for(let i=Math.max(0,a);i<Math.min(cols,c);i++)blk[j*cols+i]=1}
  const cell=(x,y)=>[Math.min(cols-1,Math.max(0,Math.floor((x-x0)/G))),Math.min(rows-1,Math.max(0,Math.floor((y-y0)/G)))];
  const ctr=(i,j)=>({x:x0+i*G+G/2,y:y0+j*G+G/2});
  const blocked=(a,b)=>{const dx=Math.max(40,Math.abs(b.x-a.x)/2);for(let t=.06;t<.95;t+=.03){const u=1-t;const x=u*u*u*a.x+3*u*u*t*(a.x+dx)+3*u*t*t*(b.x-dx)+t*t*t*b.x,y=u*u*u*a.y+3*u*u*t*a.y+3*u*t*t*b.y+t*t*t*b.y;const [i,j]=cell(x,y);if(blk[j*cols+i])return true}return false};
  const DX=[1,0,-1,0],DY=[0,1,0,-1];const gs=new Float32Array(NC*4),came=new Int32Array(NC*4);
  for(const [pid,cid] of edges){const P=N(pid),C=N(cid),a=port(P,'out'),b=port(C,'in');
    if(b.x-a.x>48&&!blocked(a,b)){paths[cid]=bez(a,b);continue}
    const [si,sj]=cell(a.x+G*1.5,a.y),[ei,ej]=cell(b.x-G*1.5,b.y);
    gs.fill(Infinity);came.fill(-1);const heap=[];
    const push=(f,s)=>{heap.push([f,s]);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
    const pop=()=>{const t=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){let m=i;const L=2*i+1,R=L+1;if(L<heap.length&&heap[L][0]<heap[m][0])m=L;if(R<heap.length&&heap[R][0]<heap[m][0])m=R;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return t};
    const s0=(sj*cols+si)*4;gs[s0]=0;push(Math.abs(ei-si)+Math.abs(ej-sj),s0);let goal=-1,it=0;
    while(heap.length&&it++<120000){const [f,s]=pop();const c=s>>2,dir=s&3,ci=c%cols,cj=(c/cols)|0;if(f-(Math.abs(ei-ci)+Math.abs(ej-cj))>gs[s]+.01)continue;if(ci===ei&&cj===ej){goal=s;break}
      for(let nd=0;nd<4;nd++){if(nd===((dir+2)&3))continue;const ni=ci+DX[nd],nj=cj+DY[nd];if(ni<0||nj<0||ni>=cols||nj>=rows)continue;const nc=nj*cols+ni;if(blk[nc]&&!(ni===ei&&nj===ej))continue;
        const g=gs[s]+1+(nd!==dir?4:0)+(ni===ei&&nj===ej&&nd!==0?4:0);const ns=nc*4+nd;if(g<gs[ns]){gs[ns]=g;came[ns]=s;push(g+Math.abs(ei-ni)+Math.abs(ej-nj),ns)}}}
    if(goal<0){paths[cid]=bez(a,b);continue}
    const cells=[];for(let s=goal;s>=0;s=came[s]){const c=s>>2;cells.push(ctr(c%cols,(c/cols)|0));if(s===s0)break}cells.reverse();
    const pts=[cells[0]];for(let i=1;i<cells.length-1;i++){const p=pts[pts.length-1],q=cells[i],r=cells[i+1];if(!((p.x===q.x&&q.x===r.x)||(p.y===q.y&&q.y===r.y)))pts.push(q)}if(cells.length>1)pts.push(cells[cells.length-1]);
    const fy=pts[0].y;pts[0]={x:pts[0].x,y:a.y};if(pts[1]&&pts[1].y===fy)pts[1]={x:pts[1].x,y:a.y};
    const L=pts.length-1,ly=cells[cells.length-1].y;pts[L]={x:pts[L].x,y:b.y};if(L>0&&pts[L-1].y===ly)pts[L-1]={x:pts[L-1].x,y:b.y};
    paths[cid]=rounded([a,...pts,b])}
  routeCache={key,paths};return paths}
function rounded(p){const q=[p[0]];for(let i=1;i<p.length;i++){const l=q[q.length-1];if(Math.abs(l.x-p[i].x)>.5||Math.abs(l.y-p[i].y)>.5)q.push(p[i])}
  let d=`M${q[0].x} ${q[0].y}`;for(let i=1;i<q.length-1;i++){const a=q[i-1],b=q[i],c=q[i+1];const l1=Math.hypot(b.x-a.x,b.y-a.y)||1,l2=Math.hypot(c.x-b.x,c.y-b.y)||1;const r=Math.min(12,l1/2,l2/2);
    d+=` L${b.x-(b.x-a.x)/l1*r} ${b.y-(b.y-a.y)/l1*r} Q${b.x} ${b.y} ${b.x+(c.x-b.x)/l2*r} ${b.y+(c.y-b.y)/l2*r}`}
  const z=q[q.length-1];return d+` L${z.x} ${z.y}`}

/* render */
const matches=n=>query&&(n.t+'\n'+n.d+'\n'+(n.m?n.m.name:'')).toLowerCase().includes(query);
function render(){const m=M();if(!m)return;if(m.mode==='auto')autoLayout();else placeNew();
  const vis=Object.values(m.nodes).filter(n=>visible(n.id));
  const edges=vis.filter(n=>n.p&&N(n.p)).map(n=>[n.p,n.id]);
  const paths=(m.mode==='free'&&!dragging)?routeAll(vis,edges):null;
  let es='';for(const [p,c] of edges){const P=N(p),C=N(c),col=branchColor(c)||'#888',a=port(P,'out'),b=port(C,'in'),d=paths?paths[c]:bez(a,b);

function bounds(){const vis=Object.values(M().nodes).filter(n=>visible(n.id));let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const n of vis){const s=size(n);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+s.w);y1=Math.max(y1,n.y+s.h)}return {x0,y0,x1,y1}}

  if(a==='md'){const out=[];const go=(id,d)=>{const n=N(id);out.push('  '.repeat(d)+'- '+n.t);if(n.d.trim())n.d.split('\n').forEach(l=>out.push('  '.repeat(d+1)+'> '+l));kids(id).forEach(c=>go(c.id,d+1))};roots().forEach(r=>go(r.id,0));try{await navigator.clipboard.writeText(out.join('\n'));toast('Markdown 大纲已复制')}catch(err){toast('浏览器不允许复制')}}
  if(a==='seed'&&!await loadSeed())toast('没有找到使用说明');
  if(a==='delmap'){if(st.maps.length<2)return toast('至少保留一张导图');if(await ask(`删除导图“${m.title}”？此操作不能撤销，建议先导出备份。`)){for(const n of Object.values(m.nodes))if(n.m)fdel(n.m.key);st.maps=st.maps.filter(x=>x!==m);st.cur=st.maps[0].id;sel=roots()[0]?.id;undo=[];redo=[];save();render();fit()}}});
$('#jsonIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());
    if(j.nodes){for(const [k,v] of Object.entries(j.files||{})){const bl=await (await fetch(v)).blob();await fput(k,bl)}const nodes={};for(const n of Object.values(j.nodes))nodes[n.id]={id:String(n.id),t:String(n.t||''),d:String(n.d||''),p:n.p||null,o:!!n.o,k:+n.k||0,x:+n.x||0,y:+n.y||0,m:n.m||null};newMap(j.title||'导入的导图',nodes,j.mode==='free'?'free':'auto')}
    else{const r=j.root||j;if(!r.t&&!r.title)throw 0;newMap(j.title||r.t||r.title,fromTree(r))}toast('已导入为新导图')}catch(err){toast('文件格式不对，无法导入')}};
document.addEventListener('keydown',e=>{const tag=document.activeElement.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
  if($('#viewer').classList.contains('on')){if(e.key==='Escape')closeViewer();return}if($('#modal').classList.contains('on'))return;
  const k=e.key,c=e.ctrlKey||e.metaKey;
  if(c&&k.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}if(c&&k.toLowerCase()==='y'){e.preventDefault();doRedo();return}
  const n=N(sel);if(!n)return;
  if(k==='Tab'){e.preventDefault();addChild()}else if(k==='Enter'){e.preventDefault();addSib()}else if(k==='Delete'||k==='Backspace'){e.preventDefault();del()}
  else if(k==='F2'){e.preventDefault();focusTitle()}else if(k===' '){e.preventDefault();toggle(sel)}
  else if(k==='ArrowLeft'){e.preventDefault();if(n.p){select(n.p);ensureVisible(N(n.p))}}
  else if(k==='ArrowRight'){e.preventDefault();const ks=kids(n.id);if(ks.length){if(!n.o)toggle(n.id,true);select(ks[0].id);ensureVisible(ks[0])}}
  else if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();const s=kids(n.p),i=s.findIndex(x=>x.id===n.id)+(k==='ArrowUp'?-1:1);if(s[i]){select(s[i].id);ensureVisible(s[i])}}
  else if(k==='Escape')$('#panel').classList.add('hide')});
addEventListener('beforeunload',()=>{if(RO)return;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}});
addEventListener('resize',applyView);

/* sharing: map is gzipped + AES-GCM encrypted in the browser, stored as ciphertext in the repo.
   The key lives only in the link's #fragment, which browsers never send to any server. */
const GH={owner:'RanRuiqian',repo:'RanRuiqian.github.io',dir:'thinking-tree/shared/'},TOKKEY='thinking-tree.gh';
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>unb64(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));
const pipe=async(u,t)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(t)).arrayBuffer());
async function pwKey(pw,salt,use){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,[use])}
async function seal(bytes,sh){const iv=crypto.getRandomValues(new Uint8Array(12));let key,salt=new Uint8Array(16);
  if(sh.pw){salt=crypto.getRandomValues(new Uint8Array(16));key=await pwKey(sh.pw,salt,'encrypt')}else key=await crypto.subtle.importKey('raw',unb64u(sh.k),'AES-GCM',false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));const out=new Uint8Array(4+16+12+ct.length);out.set([84,84,50,sh.pw?1:0]);out.set(salt,4);out.set(iv,20);out.set(ct,32);return out}
async function unseal(buf,k,pw){const salt=buf.subarray(4,20),iv=buf.subarray(20,32),ct=buf.subarray(32);const key=buf[3]?await pwKey(pw,salt,'decrypt'):await crypto.subtle.importKey('raw',unb64u(k),'AES-GCM',false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct))}
async function ghApi(method,id,body){const tok=localStorage.getItem(TOKKEY);const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.dir}${id}.bin`+(method==='GET'?'?ref=main':''),{method,cache:'no-store',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(method==='GET'&&r.status===404)return null;if(!r.ok){const e=new Error(r.status===401||r.status===403?'token':'net '+r.status);throw e}return r.json()}
function shareLink(sh){return location.origin+location.pathname+'#s='+sh.id+(sh.pw?'':'.'+sh.k)}
async function openShare(){const m=M(),B=$('#shareBox'),S=$('#shareM');S.classList.add('on');const close=()=>S.classList.remove('on');
  const tok=localStorage.getItem(TOKKEY);
  if(!tok){B.innerHTML=`<h3>第一次分享：连接你的 GitHub</h3><p class="sm">分享时，导图会先在你的浏览器里加密，再把加密后的文件存进你的 GitHub 仓库。为此需要一个只能改这个仓库的令牌，只需要设置一次。</p>
    <ol><li>打开 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 新建令牌页面</a>（Fine-grained token）</li><li>Repository access 选 <b>Only select repositories</b> → <b>${GH.repo}</b></li><li>Permissions → Repository permissions → <b>Contents</b> 选 <b>Read and write</b></li><li>生成后复制，粘贴到下面</li></ol>
    <input type="password" id="shTok" placeholder="github_pat_…" autocomplete="off"><p class="sm">令牌只保存在这个浏览器里，不会出现在分享链接中。</p><div class="row"><button class="sb" id="shNo">取消</button><button class="ib pri" id="shOk">保存并继续</button></div>`;
    $('#shNo').onclick=close;$('#shOk').onclick=()=>{const v=$('#shTok').value.trim();if(!v)return;localStorage.setItem(TOKKEY,v);openShare()};return}
  const sh=m.share;
  B.innerHTML=`<h3>分享“${esc(m.title)}”</h3><p class="sm">拿到链接的人才能打开，而且只能查看。链接里带着解密钥匙；没有链接，就算有人翻到仓库，看到的也只是加密乱码。</p>
    ${sh?`<div class="link"><input type="text" readonly id="shLink" value="${esc(shareLink(sh))}"><button class="ib pri" id="shCopy">复制</button></div><p class="sm">${sh.pw?'对方打开后还要输入访问密码。':''}你在这张导图里改了内容后，点“更新分享内容”，原来的链接不变，对方刷新就能看到新内容（最多晚几分钟）。</p>`:
      `<label><input type="checkbox" id="shUsePw"> 另外再加一个访问密码（链接被转发出去也打不开）</label><input type="password" id="shPw" placeholder="访问密码" hidden autocomplete="new-password">`}
    <div class="row">${sh?'<button class="sb" id="shStop">停止分享</button>':''}<button class="sb" id="shTokReset">更换令牌</button><button class="sb" id="shNo">关闭</button><button class="ib pri" id="shOk">${sh?'更新分享内容':'生成分享链接'}</button></div>`;
  $('#shNo').onclick=close;$('#shTokReset').onclick=()=>{localStorage.removeItem(TOKKEY);openShare()};
  if($('#shUsePw'))$('#shUsePw').onchange=e=>$('#shPw').hidden=!e.target.checked;
  if($('#shCopy'))$('#shCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#shLink').value);toast('链接已复制')}catch(e){$('#shLink').select()}};
  if($('#shStop'))$('#shStop').onclick=async()=>{if(!await ask('停止分享后，原来的链接会失效。确定吗？'))return;try{const cur=await ghApi('GET',sh.id);if(cur)await ghApi('DELETE',sh.id,{message:'share: remove',sha:cur.sha,branch:'main'});delete m.share;save();toast('已停止分享');openShare()}catch(e){toast(e.message==='token'?'令牌无效或没有权限，请点“更换令牌”':'网络出错，请重试')}};
  $('#shOk').onclick=async()=>{const btn=$('#shOk');let next=sh?{...sh}:{id:b64u(crypto.getRandomValues(new Uint8Array(12)))};
    if(!sh){if($('#shUsePw').checked){const pw=$('#shPw').value;if(pw.length<4)return toast('密码至少 4 位');next.pw=pw}else next.k=b64u(crypto.getRandomValues(new Uint8Array(32)))}
    btn.disabled=true;btn.textContent='正在加密上传…';
    try{const files={};for(const n of Object.values(m.nodes))if(n.m){const bl=await fget(n.m.key).catch(()=>null);if(bl)files[n.m.key]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(bl)})}
      const raw=new TextEncoder().encode(JSON.stringify({format:'thinking-tree/2',title:m.title,mode:m.mode,nodes:m.nodes,files}));
      const sealed=await seal(await pipe(raw,new CompressionStream('gzip')),next);
      if(sealed.length>45e6)throw new Error('big');
      const cur=await ghApi('GET',next.id);await ghApi('PUT',next.id,{message:'share: update',content:b64(sealed),branch:'main',...(cur?{sha:cur.sha}:{})});
      m.share=next;save();toast(sh?'分享内容已更新':'分享链接已生成');openShare()}
    catch(e){btn.disabled=false;btn.textContent=sh?'更新分享内容':'生成分享链接';toast(e.message==='token'?'令牌无效或没有权限，请点“更换令牌”':e.message==='big'?'文件太大（超过 45 MB），请删掉一些大文件再分享':'上传失败，请检查网络后重试')}}}
$('#shareM').addEventListener('click',e=>{if(e.target.id==='shareM')$('#shareM').classList.remove('on')});
async function fetchShared(id){const urls=[[`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.dir}${id}.bin?ref=main`,{Accept:'application/vnd.github.raw'}],[`https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/main/${GH.dir}${id}.bin`,{}],[`shared/${id}.bin`,{}]];
  for(const [u,h] of urls){try{const r=await fetch(u,{headers:h,cache:'no-store'});if(r.ok)return new Uint8Array(await r.arrayBuffer());if(r.status===404&&u.startsWith('https://api'))return null}catch(e){}}return null}
async function loadShared(){const [id,k]=location.hash.slice(3).split('.');$('#status').textContent='正在打开分享的导图…';
  const buf=await fetchShared(id);if(!buf||buf[0]!==84||buf[2]!==50){await ask('这个分享链接已经失效，或者链接不完整。');return false}
  let plain=null,pw=null;for(let t=0;t<5&&!plain;t++){if(buf[3]){pw=await ask(t?'密码不对，请重新输入访问密码':'这张导图设置了访问密码，请输入','',true);if(pw===null)return false}
    try{plain=await unseal(buf,k,pw)}catch(e){if(!buf[3]){await ask('链接里的钥匙不对，可能链接没有复制完整。');return false}}}
  if(!plain)return false;
  const j=JSON.parse(new TextDecoder().decode(await pipe(plain,new DecompressionStream('gzip'))));
  for(const [fk,v] of Object.entries(j.files||{}))await fput(fk,await (await fetch(v)).blob());
  RO=true;document.body.classList.add('ro');$('#tIn').readOnly=$('#dIn').readOnly=true;$('#tEdit').hidden=true;
  st={maps:[{id:'shared',title:j.title||'分享的导图',mode:j.mode==='free'?'free':'auto',nodes:j.nodes}],cur:'shared'};sel=roots()[0]?.id;
  document.title=(j.title||'分享的导图')+' · 思路树';render();fit();$('#status').textContent='只读查看';return true}
function keepShared(){if(!RO)return;let mine={maps:[],cur:null};try{mine=JSON.parse(localStorage.getItem(KEY)||'null')||mine}catch(e){}
  const m=JSON.parse(JSON.stringify(M()));m.id=uid();delete m.share;mine.maps.push(m);mine.cur=m.id;localStorage.setItem(KEY,JSON.stringify(mine));
  location.replace(location.pathname)}
$('#bKeep').onclick=keepShared;
addEventListener('hashchange',()=>{if(location.hash.startsWith('#s=')||RO)location.reload()});
async function loadSeed(){try{const r=await fetch('seed.json',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();newMap(j.title||'使用说明',fromTree(j.root));return true}catch(e){return false}}
(async()=>{if(location.hash.startsWith('#s=')){if(await loadShared())return;history.replaceState(null,'',location.pathname)}let ok=false;
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.maps&&s.maps.length){st=s;if(!M())st.cur=st.maps[0].id;ok=true}}catch(e){}
  if(!ok){try{const o=JSON.parse(localStorage.getItem(OLDKEY)||'null');if(o&&o.maps&&o.maps.length){const ix=Math.max(0,o.maps.findIndex(m=>m.id===o.cur));st={maps:o.maps.map(m=>({id:m.id,title:m.title,mode:'auto',nodes:fromTree(m.root)})),cur:null};st.cur=st.maps[ix].id;ok=true;save();setTimeout(()=>toast('已把旧版导图迁移到新版本'),300)}}catch(e){}}
  if(ok){sel=roots()[0]?.id;render();fit();$('#status').textContent='已载入上次的内容'}
  else if(!await loadSeed())newMap('我的第一张导图');
  vp.focus()})();
}
