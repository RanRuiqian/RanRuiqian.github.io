<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ran Ruiqian · 作品集 Portfolio</title>
<style>
/* Layout idea: an engineering drawing sheet. Hairline frames, a title block on every project, a reticle in the hero. Monochrome only. */
:root{
  --bg:#fafaf8; --ink:#111110; --mute:#5f5f5b; --rule:#cdcdc8; --tint:#efefeb;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","SimSun",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","PingFang SC","Microsoft YaHei",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e0e0d;--ink:#ecece8;--mute:#a0a09a;--rule:#34342f;--tint:#181816;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e0e0d;--ink:#ecece8;--mute:#a0a09a;--rule:#34342f;--tint:#181816;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--serif);font-feature-settings:"kern","liga";-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
b{font-weight:600}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.mute{color:var(--mute)}

/* header */
.site{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ink)}
.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
.brand{font:500 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.site nav{display:flex;align-items:center;gap:clamp(12px,3vw,28px)}
.site nav a,.site nav button{font:400 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--mute);background:none;border:0;padding:6px 0;cursor:pointer}
.site nav a:hover,.site nav button:hover,.site nav a[aria-current="page"]{color:var(--ink)}
.site nav a[aria-current="page"]{border-bottom:1px solid var(--ink)}
.site nav .lang{color:var(--ink);border:1px solid var(--ink);padding:6px 10px}
.site nav .lang:hover{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr);gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(36px,7vw,80px) 0 clamp(28px,5vw,56px)}
.kicker{margin:0 0 20px;color:var(--mute)}
.hero h1{margin:0;font-weight:300;font-size:clamp(56px,11.5vw,128px);line-height:.92;letter-spacing:-.035em;text-wrap:balance}
.hero .lead{margin:28px 0 0;max-width:34em;font-size:clamp(18px,2.2vw,22px);line-height:1.55;text-wrap:pretty}
.hero .lead2{margin:14px 0 0;max-width:36em;color:var(--mute);font-size:16px;line-height:1.65}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-block;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--ink);padding:14px 18px;background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--bg);color:var(--ink)}
.reticle{width:100%;height:auto;display:block;color:var(--ink)}
.reticle-cap{margin:8px 0 0;color:var(--mute);font:400 11px/1.6 var(--mono);letter-spacing:.04em}

/* facts */
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.fact{padding:22px 20px 22px 0;border-left:1px solid var(--rule);padding-left:20px}
.fact:first-child{border-left:0;padding-left:0}
.fact .v{display:block;font-size:clamp(28px,3.6vw,42px);line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fact .l{display:block;margin-top:8px;font-size:14px;line-height:1.45;color:var(--mute)}

/* section heads */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:clamp(48px,8vw,88px) 0 0;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.sh h2{margin:0;font-weight:400;font-size:clamp(26px,3.4vw,38px);line-height:1.15;letter-spacing:-.015em}
.sh .mono{color:var(--mute)}

/* project index */
.grp{margin:28px 0 0;color:var(--mute)}
.idx{border-top:1px solid var(--rule);margin-top:10px}
.idx a{display:grid;grid-template-columns:56px minmax(0,1fr) 200px 120px 28px;gap:16px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--rule);text-decoration:none;transition:background .15s,color .15s,padding .15s}
.idx a:hover,.idx a:focus-visible{background:var(--ink);color:var(--bg);padding-left:14px;padding-right:14px}
.idx a:hover .mute,.idx a:focus-visible .mute{color:var(--bg);opacity:.75}
.idx .n{font:400 13px/1 var(--mono);color:var(--mute)}
.idx a:hover .n{color:var(--bg)}
.idx .t{font-size:clamp(20px,2.4vw,26px);line-height:1.25;letter-spacing:-.01em}
.idx .t small{display:block;margin-top:4px;font-size:14px;line-height:1.5;color:var(--mute)}
.idx a:hover .t small{color:var(--bg);opacity:.75}
.idx .k,.idx .d{font:400 12px/1.5 var(--mono);letter-spacing:.04em;color:var(--mute)}
.idx a:hover .k,.idx a:hover .d{color:var(--bg);opacity:.8}
.idx .ar{font:400 16px/1 var(--mono);text-align:right}

.gl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);margin-top:20px}
.gl>div{padding:18px 20px 18px 0;border-bottom:1px solid var(--rule)}
.gl .lb{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.gl .vl{display:block;font-size:15.5px;line-height:1.6}
/* two-column blocks */
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);margin-top:28px}
.cols p{margin:0 0 14px;max-width:38em;text-wrap:pretty}

/* rows (education, experience) */
.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.row .d{font:400 12px/1.7 var(--mono);letter-spacing:.04em;color:var(--mute)}
.row b{font-weight:600}
.row p{margin:2px 0 0;color:var(--mute);font-size:15.5px;line-height:1.6}

/* tables */
.figs{display:grid;gap:22px}.figs.c2{grid-template-columns:1fr 1fr}.figs figure{margin:0}.figs:not(.c2) figure.sm img{max-width:520px}.figs img{display:block;width:100%;height:auto;border:1px solid var(--rule);background:#fff}.figs figcaption{font:400 12.5px/1.55 var(--mono);color:var(--mute);margin-top:8px}@media(max-width:700px){.figs.c2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 0;font-size:15.5px;line-height:1.55}
.tbl th{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:0 16px 8px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:10px 16px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.num{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.scroll{overflow-x:auto}
.sk{min-width:720px}.sk th:first-child,.sk td:first-child{width:150px}.sk th:last-child,.sk td:last-child{width:150px}

/* project page */
.back{display:inline-block;margin-top:28px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--ink)}
.ph{padding:20px 0 0}
.ph h1{margin:10px 0 0;font-weight:300;font-size:clamp(36px,6.4vw,72px);line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.ph .lead{margin:18px 0 0;max-width:38em;font-size:clamp(18px,2vw,21px);line-height:1.55;text-wrap:pretty}
.tb{display:grid;grid-template-columns:repeat(6,1fr);margin-top:32px;border:1px solid var(--ink)}
.tb>div{padding:12px 14px 14px;border-left:1px solid var(--ink);border-top:1px solid var(--ink);min-width:0}
.tb>div:nth-child(-n+6){border-top:0}
.tb>div:first-child{border-left:0}
.tb .lb{display:block;font:400 10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.tb .vl{display:block;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.tb .w2{grid-column:span 2}
.tb .w3{grid-column:span 3}
.tb .w6{grid-column:1/-1}
.sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(16px,4vw,56px);padding:36px 0;border-bottom:1px solid var(--rule)}
.sec>h2{margin:0;font:500 12px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sec>h2 span{display:block;color:var(--ink);font-size:13px}
.sec .body{min-width:0;max-width:44em}
.sec .body p{margin:0 0 14px;text-wrap:pretty}
.sec .body.wide{max-width:none}
ul.ls{list-style:none;margin:0;padding:0}
ul.ls li{position:relative;padding:0 0 12px 22px;text-wrap:pretty}
ul.ls li:before{content:"";position:absolute;left:0;top:.82em;width:10px;border-top:1px solid var(--ink)}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.tl li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.tl .d{font:400 12px/1.8 var(--mono);letter-spacing:.04em;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font:400 11.5px/1 var(--mono);letter-spacing:.04em;border:1px solid var(--ink);padding:7px 9px}
.dia{border:1px solid var(--rule);background:var(--tint);padding:14px}
.dia svg{display:block;width:100%;min-width:680px;height:auto}
.dia-cap{margin:10px 0 0;font:400 11.5px/1.6 var(--mono);color:var(--mute);letter-spacing:.03em}
.note{color:var(--mute);font-size:15.5px}
.linkline a{font:500 12.5px/1.6 var(--mono);letter-spacing:.03em;text-underline-offset:4px}

.pn{display:grid;grid-template-columns:1fr 1fr;margin-top:48px;border-top:1px solid var(--ink)}
.pn a{display:block;padding:22px 0;text-decoration:none}
.pn a:last-child{text-align:right}
.pn a:hover .t{text-decoration:underline;text-underline-offset:5px}
.pn .t{display:block;margin-top:6px;font-size:clamp(18px,2.2vw,24px);line-height:1.3}

/* contact + footer */
.contact{margin-top:clamp(56px,9vw,104px);border-top:1px solid var(--ink);padding-top:28px}
.contact h2{margin:0;font-weight:300;font-size:clamp(32px,5vw,56px);line-height:1.05;letter-spacing:-.025em}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:28px;border-top:1px solid var(--rule)}
.cgrid>div{padding:16px 16px 16px 0;border-bottom:1px solid var(--rule)}
.cgrid .lb{display:block;font:400 10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.cgrid .vl{display:block;font-size:16px;overflow-wrap:anywhere}
footer.foot{padding:24px 0 56px;color:var(--mute);font-size:14px;line-height:1.7;max-width:46em}

@media (max-width:900px){
  .gl{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:1fr}
  .reticle-box{max-width:420px}
  .facts{grid-template-columns:1fr 1fr}
  .fact:nth-child(3){border-left:0;padding-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--rule)}
  .cols{grid-template-columns:1fr}
  .tb{grid-template-columns:repeat(2,1fr)}
  .tb>div,.tb>div:first-child{border-left:0;border-top:1px solid var(--ink)}
  .tb>div:nth-child(2n){border-left:1px solid var(--ink)}
  .tb>div:nth-child(-n+2){border-top:0}
  .tb .w2,.tb .w3,.tb .w6{grid-column:1/-1;border-left:0!important}
  .sec{grid-template-columns:1fr;gap:10px}
  .idx a{grid-template-columns:40px minmax(0,1fr) 24px}
  .idx .k,.idx .d{display:none}
  .cgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  body{font-size:16.5px}
  .row{grid-template-columns:1fr;gap:2px}
  .tl li{grid-template-columns:1fr;gap:2px}
  .cgrid{grid-template-columns:1fr}
  .gl{grid-template-columns:1fr}
  .site .brand{display:none}
  .site .wrap{justify-content:flex-end}
  .pn{grid-template-columns:1fr}
  .pn a:last-child{text-align:left;border-top:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.idx a{transition:none}}
@media print{.site,.cta,.pn{display:none}.sec,.row{break-inside:avoid}body{font-size:12pt}}
</style>

/* ---------- UI strings ---------- */
var U={

/* ---------- diagrams ---------- */
function reticle(){
  var s='<svg class="reticle" viewBox="0 0 480 500" role="img" aria-label="Reticle with ruler and slanted-edge target" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1">';

  s+='<line x1="40" y1="458" x2="440" y2="458"/>';
  for(i=0;i<=20;i++){ x=40+i*20; s+='<line x1="'+x+'" y1="458" x2="'+x+'" y2="'+(i%5===0?446:452)+'"/>'; }
  var lab=[0,5,10,15,20];
  for(i=0;i<lab.length;i++){ s+='<text x="'+(40+lab[i]*20)+'" y="480" text-anchor="middle" fill="currentColor" stroke="none" font-family="IBM Plex Mono,monospace" font-size="10">'+lab[i]+(lab[i]===20?' mm':'')+'</text>'; }
  s+='</svg>';

function otoDiagram(){
  var L=EN?{
    a:['Modular handle','3D printed, threaded','~3.2 mm camera, light'],
    c:['USB imaging','1280×720 MJPG','~25 FPS'],
    d:['Windows app','Python / OpenCV','preview, mark, save'],

  }:{

    c:['USB 成像','1280×720 MJPG','约 25 FPS'],

 lead:b('传统耳镜只有持镜的人看得到耳道，老师没法实时确认学生有没有对准。我做了一支零件和材料约 22 美元的模块化数字耳镜：3.2 mm 微型摄像头加 3D 打印笔式手柄，电脑、手机和 iPad 扫码就能同时看同一路实时画面。从摄像头选型、结构设计、成像测试到软件交付、伦理审批和论文，由我牵头完成，论文已被 IECBES 2026 录用。',
        'In a conventional otoscope only the holder sees the ear canal, so a teacher cannot check in real time whether a student is aimed correctly. I built a modular digital otoscope whose parts and materials cost about USD 22: a 3.2 mm micro camera in a 3D-printed pen-style handle, with a live image that a PC, phone and iPad can all watch by scanning a QR code. I led it from camera selection, structural design and imaging tests through software delivery, ethics approval and the paper, which is accepted at IECBES 2026.'),

 role:b('产品定义、软件与结构方案决策、实物测量、打印与试装、验收','Product definition, software and structural decisions, physical measurement, printing, fitting and acceptance'),
 status:b('软件已完成并日常使用；外壳持续迭代；后续个人商业化','Software complete and in daily use; enclosure iterating; personal commercialisation planned'),
 tools:'Swift · Objective-C · Bash · launchd · CadQuery · Bambu Studio · PLA / PETG / TPU',
 lead:b('把一台拆掉屏幕的 2019 款 MacBook Pro 和一台 iPad Air 13 英寸（M3）做成一台真正的笔记本：开机、插线，iPad 就自动成为 Mac 的屏幕，不需要任何确认；下壳装主机，上壳是 iPad 的日常保护壳，可快拆，合起来是一个完整的扁平长方体。',
        'A 2019 MacBook Pro with its display removed and a 13-inch iPad Air (M3) become one working notebook: boot, plug in, and the iPad becomes the Mac’s screen with no confirmation. The lower shell holds the Mac, the upper shell is the iPad’s everyday case and detaches quickly, and closed it forms one flat cuboid.'),
 secs:[
  {t:'list',h:b('我做了什么','What I did'),items:[
    b('**定义产品：**无屏 Mac 加 iPad 当屏幕；Mac 端零确认；只用有线；iPad 连着时永远是主屏；另有键鼠共享模式。外壳的风格、尺寸原则、快拆、Pencil 笔仓和内衬也由我定。','**Product definition:** a screenless Mac with an iPad as its display; zero confirmation on the Mac; wired only; the iPad is always the primary screen; plus a keyboard-and-mouse sharing mode. I also set the enclosure’s style, size rules, quick release, Pencil bay and lining.'),
    b('**做关键决策：**两种模式拆成两个快捷指令；保留屏幕共享作备用；放弃原机铰链、改用现成摩擦铰链；上壳选择顶边滑入加可拆顶条的方案；音量键软条用榫卯式固定。','**Key decisions:** two modes as two separate Shortcuts; screen sharing kept as a fallback; the original hinge dropped in favour of off-the-shelf friction hinges; the upper shell uses a top-edge slide-in with a removable top bar; the volume strip locks in with a joint instead of glue.'),
    b('**实物测量：**用游标卡尺量 Mac 边缘厚度（前 9.7 mm、后 10.4 mm）、脚垫、接口孔高、原机铰链和 Pencil 笔尖位置，作为建模的实测依据。','**Physical measurement:** calipers on the Mac’s edge thickness (9.7 mm front, 10.4 mm rear), feet, port heights, the original hinge and the Pencil tip position, as the ground truth for modelling.'),
    b('**打印与试装：**在学校 Bambu Lab H2D 和自己的 A1 mini 上打印，逐版做实物试装和手感测试；软件部分在真机上做拔插、冷启动和热插拔测试。','**Printing and fitting:** printed on the university’s Bambu Lab H2D and my own A1 mini, fitting and hand-testing every revision; the software was tested on the real machine with plug, cold-boot and hot-plug cases.')]},
  {t:'list',h:b('软件 ipad-screen','Software: ipad-screen'),items:[
    b('**插线自动连接：**后台每 5 秒检测 USB 上的 iPad，发现后由 Mac 主动发起有线随航，实测连接约 3 秒，真实拔插后约 6 秒自动恢复。','**Plug-in auto-connect:** a background service checks USB for the iPad every 5 s and starts a wired Sidecar session itself; about 3 s to connect, about 6 s to recover after a real unplug and replug.'),
    b('**无显示器冷启动：**Mac 开机自动登录后，插上 iPad 即自动连接并成为主屏，两次冷启动测试均成功。','**Headless cold boot:** after auto-login, plugging in the iPad connects it as the main display; both cold-boot tests passed.'),
    b('**虚拟屏垫底：**没有真显示器时创建一块虚拟屏，让随航不再是唯一显示器；有真显示器时自动撤掉，五种热插拔场景全部符合预期。','**Virtual display fallback:** with no real monitor a virtual display is created so Sidecar is no longer the only display, and removed when a real monitor appears; all five hot-plug scenarios behave as designed.'),
    b('**iPad 快捷指令：**一键随航、断开、状态查询、键鼠模式、诊断、重启和关机，经 SSH 触发，由图形会话里的后台服务真正执行。','**iPad Shortcuts:** one-tap connect, disconnect, status, keyboard-mouse mode, diagnostics, restart and shutdown, triggered over SSH and executed by a background agent inside the graphical session.'),
    b('**只用有线、防睡眠、自检：**有线失败不退回无线；连接期间自动防睡眠；自检脚本覆盖 12 项系统条件，实测全部通过。','**Wired-only, keep-awake, self-check:** a failed wired link never falls back to wireless; the Mac stays awake while connected; a self-check script covers 12 system conditions and all passed.'),
    b('**细节打磨：**隐藏随航边栏和触控栏，让 iPad 上的桌面像一块原生屏幕。','**Polish:** the Sidecar sidebar and Touch Bar are hidden so the iPad desktop looks like a native display.')]},
  {t:'list',h:b('外壳','Enclosure'),items:[
    b('**参数化建模：**用 Python 和 CadQuery 按 Apple 官方尺寸图（iPad Air 13 英寸 M3，280.66 × 214.90 × 6.12 mm）加实测数据生成，改参数即可重新输出 STEP 和 STL，并自动做干涉检查。','**Parametric modelling:** generated in Python and CadQuery from Apple’s official drawing (iPad Air 13-inch M3, 280.66 × 214.90 × 6.12 mm) plus my measurements; changing a parameter regenerates STEP and STL, with automated interference checks.'),
    b('**整体尺寸：**上壳连铰链槽 313 × 252.3 × 10.8 mm，下壳 313 × 252.3 × 16.0 mm，合盖成一个完整长方体。','**Overall size:** upper shell with hinge slots 313 × 252.3 × 10.8 mm, lower shell 313 × 252.3 × 16.0 mm, closing into one cuboid.'),
    b('**结构承重、磁铁只定位：**快拆靠几何结构承力；10 × 5 × 2 mm 磁铁的位置避开 iPad 的霍尔传感器和指南针。','**Structure carries load, magnets only locate:** quick release relies on geometry; 10 × 5 × 2 mm magnets sit clear of the iPad’s Hall sensor and compass.'),
    b('**上壳：**iPad 从顶边滑入；可拆顶条上带 TPU 音量键软条（榫头弯折插入）、Apple Pencil 笔仓和顶边挡边；指纹键处为贯穿豁口，方便直接按压。','**Upper shell:** the iPad slides in from the top edge; a removable top bar carries the TPU volume strip (a tenon bent into place), the Apple Pencil bay and the edge lip; the Touch ID key sits in a through-cut so it can be pressed directly.'),
    b('**下壳：**Mac 像抽屉一样从前面推入，四角垫块托住，前挡条固定，底面蜂窝散热，两侧留接口长槽。','**Lower shell:** the Mac slides in from the front like a drawer, held by corner pads and a front bar, with a honeycomb base for ventilation and long port slots on both sides.'),
    b('**多材料：**主体用 PLA 或 PETG，音量键软条用 TPU，铰链座按扭矩要求设计加强筋和硬限位。','**Multi-material:** PLA or PETG for the body, TPU for the volume strip, and hinge seats with ribs and hard stops sized to the required torque.')]},
  {t:'table',h:b('关键指标','Key figures'),head:[b('项目','Item'),b('结果','Result'),b('说明','Note')],rows:[
    [b('有线连接时间','Wired connect time'),'≈ 3 s',b('实测','measured')],

    [b('冷启动','Cold boot'),'2 / 2',b('无显示器自动连接并成为主屏','auto-connects as main display with no monitor')],
    [b('系统自检','System self-check'),'12 / 12',b('doctor 脚本','doctor script')],
    [b('代码规模','Code size'),'17 files · 702 lines',b('工具与脚本，另有 step1–step20 真机测试脚本','tools and scripts, plus step1–step20 on-device test scripts')],
    [b('外壳干涉检查（v5 上壳）','Enclosure interference (upper v5)'),'0 mm³',b('iPad 就位、顶边滑入全程、顶条按入全程','iPad seated, full top-edge slide-in, full top-bar insertion')],
    [b('铰链槽配合间隙','Hinge-slot clearance'),'0.15 mm',b('实物试装，松紧合适','fitted on the real part; snug and stable')]]},
  {t:'timeline',h:b('时间线','Timeline'),items:[
    ['2026.10.22',b('提出需求，完成第一版工具包和 iPad 一键随航快捷指令方案。','Requirements set; first toolkit and the one-tap Sidecar Shortcut plan done.')],
    ['2026.11.11',b('在真机上编译运行并完成软件，同日决定做定制 3D 打印外壳。','Compiled and ran on the real machine, software completed; the same day I decided to build a custom 3D-printed enclosure.')],
    ['2026.11.12',b('隐藏随航边栏和触控栏；上壳 v1 建模并切片出测试件。','Sidecar sidebar and Touch Bar hidden; upper shell v1 modelled and a test piece sliced.')],
    ['2026.11.13',b('上壳 v2、铰链槽和锁块完成，PLA 实物打印。','Upper shell v2, hinge slots and lock block done and printed in PLA.')],
    ['2026.11.14',b('下壳 v1、TPU 音量键软条 v4 完成；整理 v5 总方案。','Lower shell v1 and TPU volume strip v4 done; v5 master plan written.')],
    ['2026.11.15',b('上壳 v5 建模并通过数字干涉检查，试件和软条切片完成，进入打印验证。','Upper shell v5 modelled and cleared by digital interference checks; test pieces and strips sliced and ready for print validation.')],
    ['2026.11 –',b('继续迭代外壳；零件采购后整壳打印；规划个人商业化。','Enclosure keeps iterating; full-shell print once parts arrive; personal commercialisation planned.')]]},
  {t:'text',h:b('持续优化与商业化','Ongoing refinement and commercialisation'),p:[
    b('软件部分已经是完整可用的形态，日常使用中，目前的优化集中在体验细节。外壳在数天内完成了上壳 v1 到 v5 的迭代和下壳首版，每一版都以实物试装和数字干涉检查为依据。后续计划完成整壳的铰链、磁铁和内衬方案，并把 padbook 作为我个人的产品项目推进商业化。','The software is already a complete, usable form and in daily use; current work is on experience details. The enclosure went from upper-shell v1 to v5 plus a first lower shell within days, each revision grounded in physical fitting and digital interference checks. Next I will finish the hinge, magnet and lining scheme for the full shell, and take padbook forward as my own commercial product.')]},

{id:'ai-memory',no:'07',grp:'tools',
 title:b('AI 共享记忆系统','Shared Memory System for AI Agents'),
 sub:b('MCP 服务器 · 原文留痕 · 自动备份 · 一句话交接','MCP server · full transcripts · automatic backup · one-phrase handover'),
 kind:b('个人系统','Personal system'), period:'2026.11 –',
 role:b('系统设计、需求定义、架构取舍与验收；主要由 AI 辅助实现','System design, requirements, architecture trade-offs and acceptance; implemented mainly with AI assistance'),
 status:b('已投入运行：每日自动维护、7 个 AI 代理已接入','In operation: daily automated maintenance, 7 AI agents connected'),
 tools:'Python · MCP · SQLite · Git / GitHub · Windows Task Scheduler · Google Drive · Obsidian',
 lead:b('我同时使用多个 AI 代理，它们互不知道对方做过什么。我设计了一套所有 AI 共用的长期记忆：对话完整留痕，任何 AI 一句“交接”就能接上进度，每天自动备份，并且不依赖任何一家服务商。',
        'I work with many AI agents and none of them knows what the others have done. I designed one long-term memory they all share: conversations are kept in full, any agent can pick up progress on a single handover phrase, backups run daily, and nothing depends on any one vendor.'),
 secs:[
  {t:'list',h:b('系统设计','System design'),items:[
    b('**两层记忆：**提炼层（项目状态、日志、缓存，记录决定、进展和失败原因）供 AI 优先读取；原文层保存完整对话，需要追溯时再查。','**Two memory layers:** a distilled layer (project status, logs, cache, recording decisions, progress and failure reasons) that agents read first, and a raw layer holding full transcripts for when tracing is needed.'),
    b('**统一入口（MCP 服务器）：**提供项目列表、全文搜索（含原文层）、读取、写入缓存、追加项目日志和更新项目状态六类工具；服务器自带行为规则，任何 AI 一连上就会拿到。','**One entry point (an MCP server):** six tool families (list projects, full-text search including the raw layer, read, write cache, append project log, update project status); the server carries its own rules, so any agent receives them on connection.'),
    b('**可审计、可撤销：**每次变更写入编号日志，每条都能撤销，目前已累计 55 条；主仓库托管在 GitHub 私有仓库，原始对话只留本地。','**Auditable and reversible:** every change is entered in a numbered log and can be undone, 55 entries so far; the main repository is a private GitHub repo, while raw transcripts stay local.'),
    b('**并入而不是另起：**发现已有一套记忆仓库和服务器后，我选择合并而非重建，Obsidian 只做“查看窗口”。','**Merge, don’t rebuild:** on finding an existing memory repository and server I merged into it rather than starting over, with Obsidian serving only as a viewing window.')]},
  {t:'list',h:b('自动化流水线','Automation pipeline'),items:[
    b('**对话原文导入：**只读方式读取 Codex 桌面端的 SQLite 数据库，被占用时先复制再读，每个会话输出一份 Markdown；用状态文件去重，重复运行不会重复导入。已导入 85 个会话，共 3.3 MB。','**Transcript import:** reads the Codex desktop SQLite databases read-only (copying first when locked), one Markdown file per session, de-duplicated through a state file so reruns never double-import. 85 sessions, 3.3 MB, imported so far.'),
    b('**每日自动维护：**每天 23:40 由计划任务静默运行，错过的会在开机后补跑；四步依次是导入新对话、备份到 Google 云端硬盘、清理已合并的缓存、自动提交并推送。同步失败会写入报警文件。','**Daily maintenance:** a scheduled task runs silently at 23:40 and catches up after boot if missed; four steps in order: import new conversations, back up to Google Drive, clear merged cache, commit and push automatically. A sync failure writes an alert file.'),
    b('**每周整理：**每周由 AI 阅读理解当周内容，合并缓存、更新项目状态、检查过期截止日期；整套流程写成可移交的提示词，换任何 AI 都能执行。','**Weekly consolidation:** an AI reads the week’s material, merges cache, updates project status and checks expired deadlines; the whole routine is written as a portable prompt that any agent can run.'),
    b('**ChatGPT 导入：**支持官方导出的压缩包、文件夹或 conversations.json，沿对话分支还原真实内容，拖入即可导入。','**ChatGPT import:** accepts the official export as zip, folder or conversations.json, rebuilds the real thread along its active branch, and imports by drag and drop.')]},
  {t:'list',h:b('跨代理接入','Cross-agent integration'),items:[
    b('**覆盖 7 个代理：**Codex、Claude、ChatGPT 桌面端、Grok Bot，以及 WorkBuddy、DeepSeek Harness 和 Google Antigravity；各自的配置文件修改前都自动留有备份。','**Seven agents covered:** Codex, Claude, the ChatGPT desktop app, Grok Bot, plus WorkBuddy, DeepSeek Harness and Google Antigravity; each tool’s configuration is backed up automatically before it is changed.'),
    b('**一句话交接：**在各代理的全局规则中写入“交接”触发语，新的 AI 读取项目状态后即可接上进度，不用我重新交代背景。','**One-phrase handover:** a “handover” trigger is written into each agent’s global rules, so a new agent reads the project state and continues without my re-explaining the background.'),
    b('**与厂商解耦：**订阅到期或更换工具都不影响系统运行；原始对话备份在 Google 云端硬盘，备份目前只有 3.3 MB，以文本为主，增长很慢。','**Vendor independence:** a lapsed subscription or a change of tools does not affect the system; raw transcripts are backed up to Google Drive, currently just 3.3 MB of mostly text and growing slowly.')]},
  {t:'table',h:b('关键数字','Key figures'),head:[b('项目','Item'),b('结果','Result'),b('说明','Note')],rows:[
    [b('接入的 AI 代理','Connected agents'),'7',b('含 3 个后期接入的代理','including three connected later')],
    [b('已导入会话','Imported sessions'),'85',b('3.3 MB，已备份','3.3 MB, backed up')],
    [b('MCP 服务器测试','MCP server tests'),'13 / 13',b('全部通过','all passing')],
    [b('变更日志','Change log'),'55 entries',b('编号、可逐条撤销','numbered, individually reversible')],
    [b('自动维护','Automated maintenance'),b('每日 23:40','Daily 23:40'),b('漏跑后开机补跑','catches up after boot')]]},
  {t:'text',h:b('关于实现方式','How it was built'),p:[
    b('这个项目主要由 AI 辅助实现，我负责定义需求（长期运行、少维护、不依赖单一厂商）、设计整体架构和取舍、在真实环境中验收，并在过程中解决了仓库同步、编码和权限等实际问题。','The project was built mainly with AI assistance. I defined the requirements (long-running, low maintenance, no single-vendor dependence), designed the overall architecture and trade-offs, accepted the result in the real environment, and resolved practical issues along the way such as repository sync, encoding and permissions.')]},
  {t:'tags',tags:['MCP','Agent memory','Python','SQLite','Git','Task automation','Backup','Handover protocol','Obsidian']}

/* ---------- renderers ---------- */
function section(num,h,inner,wide){
  return '<section class="sec"><h2><span>'+esc(num)+'</span>'+esc(T(h))+'</h2><div class="body'+(wide?' wide':'')+'">'+inner+'</div></section>';
}
function renderSec(s,i){
  var num=(i<9?'0':'')+(i+1), h=s.h, out='', k;
  if(s.t==='text'){
    for(k=0;k<s.p.length;k++) out+='<p>'+rich(s.p[k])+'</p>';
    return section(num,h,out);
  }
  if(s.t==='list'){
    out='<ul class="ls'+(s.note?' note':'')+'">';
    for(k=0;k<s.items.length;k++) out+='<li>'+rich(s.items[k])+'</li>';
    return section(num,h,out+'</ul>');
  }
  if(s.t==='table'){
    out='<div class="scroll"><table class="tbl"><thead><tr>';
    for(k=0;k<s.head.length;k++) out+='<th>'+esc(T(s.head[k]))+'</th>';
    out+='</tr></thead><tbody>';
    s.rows.forEach(function(r){
      out+='<tr>';
      r.forEach(function(c,ci){
        var isNum=(typeof c==='string');
        out+='<td'+(isNum?' class="num"':'')+'>'+esc(T(c))+'</td>';
      });
      out+='</tr>';
    });
    return section(num,h,out+'</tbody></table></div>',true);
  }
  if(s.t==='timeline'){
    out='<ul class="tl">';
    s.items.forEach(function(it){ out+='<li><span class="d">'+esc(it[0])+'</span><span>'+rich(it[1])+'</span></li>'; });
    return section(num,h,out+'</ul>',true);
  }
  if(s.t==='diagram'){
    out='<div class="scroll dia">'+DIAG[s.fn]()+'</div>'+(s.cap?'<p class="dia-cap">'+esc(T(s.cap))+'</p>':'');
    return section(num,h,out,true);
  }
  if(s.t==='fig'){
    out='<div class="figs'+(s.cols?' c'+s.cols:'')+'">'+s.items.map(function(f){return '<figure'+(f.sm?' class="sm"':'')+'><img src="'+esc(f.src)+'" alt="'+esc(T(f.cap))+'"><figcaption>'+esc(T(f.cap))+'</figcaption></figure>'}).join('')+'</div>';
    return section(num,h,out,true);
  }
  if(s.t==='tags'){
    out='<div class="tags">'+s.tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>';
    return section(num,b('关键词','Keywords'),out);
  }
  return '';
}

/* ---------- router ---------- */
function parse(){
  var h=decodeURIComponent((location.hash||'').replace(/^#/,'')), en=false;
  if(h==='en'){en=true;h='home'}
  else if(/-en$/.test(h)){en=true;h=h.slice(0,-3)}
  if(!h) h='home';
  return {route:h,en:en};
}
function navHtml(route){
  function a(r,l){return '<a href="'+href(r)+'"'+(route===r?' aria-current="page"':'')+'>'+esc(T(l))+'</a>'}
  var other=EN?'':'-en', cur=route==='home'?'home':route;
  var langHref='#'+cur+other;
  return a('home',U.work)+a('about',U.about)+'<button type="button" id="goContact">'+esc(T(U.contact))+'</button>'+
    '<a class="lang" id="langBtn" href="'+langHref+'">'+esc(T(U.lang))+'</a>';
}
function render(){
  var st=parse(), p;
  EN=st.en;
  document.documentElement.lang=EN?'en':'zh-CN';
  p=P.filter(function(x){return x.id===st.route})[0];
  var route=p?p.id:(st.route==='about'?'about':'home');
  document.getElementById('brand').setAttribute('href',href('home'));
  document.getElementById('nav').innerHTML=navHtml(p?'home':route);
  document.getElementById('app').innerHTML=(p?projectView(p):(route==='about'?aboutView():homeView()))+contactHtml();
  var gc=document.getElementById('goContact');
  if(gc) gc.addEventListener('click',function(){var el=document.getElementById('contact'); if(el) el.scrollIntoView({behavior:'smooth'})});
  window.scrollTo(0,0);
}
